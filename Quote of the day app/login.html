<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Daily Whisper · Sign In / Register</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      position: relative;
      overflow: hidden;
      background: #0a0a2a;
    }
    .rotating-glow {
      position: fixed; top: 50%; left: 50%;
      width: 600px; height: 600px;
      margin-top: -300px; margin-left: -300px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #ff6b6b, #f06595, #cc5de8, #845ef7, #5f3dc9, #845ef7, #cc5de8, #f06595, #ff6b6b);
      filter: blur(70px);
      opacity: 0.4;
      animation: spinGlow 12s linear infinite;
      z-index: 0;
      pointer-events: none;
    }
    @keyframes spinGlow { 100% { transform: translate(-50%, -50%) rotate(360deg); } }
    .rotating-ring {
      position: fixed; top: 50%; left: 50%;
      width: 400px; height: 400px;
      margin-top: -200px; margin-left: -200px;
      border-radius: 50%;
      border: 2px solid rgba(155,107,204,0.5);
      box-shadow: 0 0 30px rgba(155,107,204,0.5);
      animation: spinRingReverse 10s linear infinite;
      z-index: 0;
      pointer-events: none;
    }
    @keyframes spinRingReverse { 100% { transform: translate(-50%, -50%) rotate(-360deg); } }

    .floating-bg {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none;
    }
    .orb-bg {
      position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(155,107,204,0.15), transparent);
      filter: blur(50px); animation: floatOrb 20s infinite alternate;
    }
    .orb1 { width: 400px; height: 400px; top: -150px; left: -150px; }
    .orb2 { width: 500px; height: 500px; bottom: -200px; right: -200px; animation-duration: 30s; }
    .orb3 { width: 300px; height: 300px; top: 50%; left: 20%; animation-duration: 18s; }
    @keyframes floatOrb { 100% { transform: translate(60px,60px) scale(1.2); opacity: 0.6; } }
    .float-item {
      position: absolute; font-size: 1.2rem; opacity: 0;
      animation: floatPositive 12s linear infinite; pointer-events: none;
    }
    .float-item:nth-child(1) { top: 10%; left: 5%; animation-duration: 14s; font-size: 1.8rem; }
    .float-item:nth-child(2) { top: 20%; left: 85%; animation-duration: 18s; font-size: 2rem; }
    .float-item:nth-child(3) { top: 70%; left: 15%; animation-duration: 16s; font-size: 1.5rem; }
    .float-item:nth-child(4) { top: 80%; left: 75%; animation-duration: 20s; font-size: 2.2rem; }
    .float-item:nth-child(5) { top: 40%; left: 45%; animation-duration: 15s; font-size: 1.6rem; }
    .float-item:nth-child(6) { top: 60%; left: 92%; animation-duration: 22s; font-size: 1.4rem; }
    @keyframes floatPositive {
      0% { transform: translateY(100vh) rotate(0deg) scale(0.5); opacity: 0; }
      10% { opacity: 0.8; }
      90% { opacity: 0.8; }
      100% { transform: translateY(-100vh) rotate(360deg) scale(1.2); opacity: 0; }
    }
    .stars {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none;
    }
    .star {
      position: absolute; background: white; border-radius: 50%; width: 2px; height: 2px;
      opacity: 0.6; animation: twinkle 3s infinite alternate;
    }
    @keyframes twinkle { 100% { opacity: 1; transform: scale(1.2); } }
    .auth-container {
      max-width: 550px; width: 100%; margin: auto; position: relative; z-index: 10;
    }
    .card {
      background: rgba(255,255,255,0.94);
      backdrop-filter: blur(12px);
      border-radius: 48px;
      padding: 2rem 1.8rem;
      text-align: center;
      border: 1px solid rgba(255,255,240,0.6);
      box-shadow: 0 25px 45px -12px rgba(0,0,0,0.25);
      animation: fadeInUp 0.6s ease;
    }
    @keyframes fadeInUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
    .role-selector {
      display: flex; gap: 1rem; justify-content: center; margin-bottom: 1.5rem;
    }
    .role-card {
      flex: 1; background: rgba(255,255,255,0.6); border-radius: 28px; padding: 0.8rem;
      cursor: pointer; transition: all 0.2s; border: 2px solid transparent;
      text-align: center;
    }
    .role-card.active {
      background: linear-gradient(135deg, #7c4dff, #9b6bcc); color: white;
      border-color: white; box-shadow: 0 8px 20px rgba(124,77,255,0.4);
    }
    .role-card i { font-size: 1.8rem; display: block; margin-bottom: 0.3rem; }
    .role-card span { font-size: 0.8rem; font-weight: 600; }
    .role-card small { font-size: 0.7rem; display: block; opacity: 0.8; }
    .portal-active {
      background: rgba(0,0,0,0.05); border-radius: 40px; padding: 0.5rem;
      margin-bottom: 1.5rem; font-size: 0.8rem; font-weight: 600;
      color: #5f3b8c; letter-spacing: 1px;
    }
    .input-group { text-align: left; margin-bottom: 1.2rem; }
    .input-group label { display: block; font-weight: 500; margin-bottom: 5px; color: #3d2a58; }
    .input-group input {
      width: 100%; padding: 12px 18px; border-radius: 60px; border: 1px solid #d9c8f0;
      background: white; font-size: 0.95rem;
    }
    .input-group input:focus { outline: none; border-color: #9f7aea; box-shadow: 0 0 0 3px rgba(159,122,234,0.2); }
    .heart-meter {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      margin: 1rem 0 1rem; font-size: 1.5rem; color: #ff6b6b;
    }
    .heart-fill {
      background: #ffe0e0; border-radius: 30px; height: 8px; width: 180px; overflow: hidden;
    }
    .heart-fill span { display: block; height: 100%; width: 0%; background: #ff4757; transition: width 0.3s ease; }
    .heart-percent { font-size: 0.8rem; font-weight: 600; color: #ff4757; }
    button {
      background: #7c4dff; color: white; border: none; padding: 12px 24px;
      border-radius: 60px; font-weight: 600; font-size: 1rem; cursor: pointer;
      width: 100%; transition: 0.2s; position: relative; overflow: hidden;
      margin-top: 0.5rem;
    }
    button:hover { background: #6a3de8; transform: translateY(-2px); }
    button::before {
      content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      transition: left 0.5s;
    }
    button:hover::before { left: 100%; }
    .btn-outline {
      background: transparent; border: 1px solid #7c4dff; color: #7c4dff;
      margin-top: 0.5rem;
    }
    .btn-outline:hover { background: #7c4dff; color: white; }
    .two-buttons { display: flex; gap: 1rem; margin-top: 0.5rem; }
    .two-buttons button { margin-top: 0; }
    .hidden-form { display: none; }
    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: #1e1428e6; color: white; padding: 10px 24px; border-radius: 40px;
      font-size: 0.85rem; opacity: 0; transition: 0.2s; pointer-events: none; z-index: 1000;
    }
    .toast.show { opacity: 1; }
    @media (max-width: 550px) { .card { padding: 1.5rem; } .role-card { padding: 0.5rem; } .role-card i { font-size: 1.4rem; } .two-buttons { flex-direction: column; gap: 0.5rem; } }
  </style>
</head>
<body>
  <div class="rotating-glow"></div><div class="rotating-ring"></div>
  <div class="floating-bg">
    <div class="orb-bg orb1"></div><div class="orb-bg orb2"></div><div class="orb-bg orb3"></div>
    <div class="float-item">✨</div><div class="float-item">❤️</div><div class="float-item">🌟</div>
    <div class="float-item">🕊️</div><div class="float-item">⭐</div><div class="float-item">💖</div>
  </div>
  <div class="stars" id="stars"></div>
  <div class="auth-container">
    <div class="card">
      <i class="fas fa-feather-alt" style="font-size: 2rem; color:#9b6bcc; margin-bottom:0.5rem;"></i>
      <div class="role-selector">
        <div class="role-card" data-role="user"><i class="fas fa-book-reader"></i><span>Quote User</span><small>Read & Favorite</small></div>
        <div class="role-card" data-role="creator"><i class="fas fa-pen-fancy"></i><span>Quote Creator</span><small>Post & Inspire</small></div>
      </div>
      <div class="portal-active" id="portalActive">QUOTE USER PORTAL ACTIVE</div>
      <!-- LOGIN FORM -->
      <div id="loginForm">
        <div class="input-group"><label><i class="fas fa-envelope"></i> EMAIL</label><input type="email" id="loginEmail" placeholder="you@example.com"></div>
        <div class="input-group"><label><i class="fas fa-lock"></i> PASSWORD</label><input type="password" id="loginPass" placeholder="*********"></div>
        <div class="two-buttons">
          <button id="signInBtn">Sign In →</button>
          <button id="showRegisterBtnFromLogin" class="btn-outline">Register</button>
        </div>
      </div>
      <div id="registerForm" class="hidden-form">
        <div class="input-group"><label><i class="fas fa-user"></i> FULL NAME</label><input type="text" id="regName" placeholder="Your name"></div>
        <div class="input-group"><label><i class="fas fa-envelope"></i> EMAIL</label><input type="email" id="regEmail" placeholder="you@example.com"></div>
        <div class="input-group"><label><i class="fas fa-lock"></i> PASSWORD</label><input type="password" id="regPass" placeholder="*********"></div>
        <div class="input-group"><label><i class="fas fa-check-circle"></i> CONFIRM PASSWORD</label><input type="password" id="regConfirm" placeholder="*********"></div>
        <div class="heart-meter"><i class="fas fa-heart"></i><div class="heart-fill"><span id="heartFill"></span></div><span class="heart-percent" id="heartPercent">0%</span></div>
        <button id="registerBtn">Create Account →</button>
        <button id="backToLoginFromRegister" class="btn-outline" style="margin-top:0.5rem;">← Back to Sign In</button>
      </div>
    </div>
  </div>
  <div id="toastMsg" class="toast"></div>
  <script>
    const starsDiv = document.getElementById('stars');
    for (let i = 0; i < 150; i++) {
      const s = document.createElement('div'); s.classList.add('star');
      s.style.left = Math.random() * 100 + '%';
      s.style.top = Math.random() * 100 + '%';
      s.style.animationDelay = Math.random() * 5 + 's';
      s.style.width = (Math.random() * 3 + 1) + 'px';
      s.style.height = s.style.width;
      starsDiv.appendChild(s);
    }

    let selectedRole = 'user';
    const roleCards = document.querySelectorAll('.role-card');
    const portalDiv = document.getElementById('portalActive');
    function updateRole(role) {
      selectedRole = role;
      roleCards.forEach(card => {
        if (card.dataset.role === role) card.classList.add('active');
        else card.classList.remove('active');
      });
      portalDiv.textContent = role === 'user' ? 'QUOTE USER PORTAL ACTIVE' : 'QUOTE CREATOR PORTAL ACTIVE';
    }
    roleCards.forEach(card => card.addEventListener('click', () => updateRole(card.dataset.role)));
    updateRole('user');

    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    document.getElementById('showRegisterBtnFromLogin').addEventListener('click', () => {
      loginForm.classList.add('hidden-form');
      registerForm.classList.remove('hidden-form');
      updateHeartMeter();
    });
    document.getElementById('backToLoginFromRegister').addEventListener('click', () => {
      loginForm.classList.remove('hidden-form');
      registerForm.classList.add('hidden-form');
    });

    function showToast(msg) {
      const toast = document.getElementById('toastMsg');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function updateHeartMeter() {
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const pass = document.getElementById('regPass').value;
      const confirm = document.getElementById('regConfirm').value;
      let progress = 0;
      if (name) progress += 25;
      if (email && email.includes('@') && email.includes('.')) progress += 25;
      if (pass.length >= 4) progress += 25;
      if (confirm && confirm === pass && pass.length >= 4) progress += 25;
      document.getElementById('heartFill').style.width = progress + '%';
      document.getElementById('heartPercent').textContent = progress + '%';
    }
    ['regName', 'regEmail', 'regPass', 'regConfirm'].forEach(id => 
      document.getElementById(id).addEventListener('input', updateHeartMeter)
    );
    updateHeartMeter();

    document.getElementById('signInBtn').addEventListener('click', () => {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPass').value;
      if (!email || !password) { showToast('Please enter email and password'); return; }
      const users = JSON.parse(localStorage.getItem('whisper_users') || '[]');
      const user = users.find(u => u.email === email && u.password === password);
      if (!user) { showToast('Invalid email or password. Please register first.'); return; }
      if (user.role !== selectedRole) {
        showToast(`You registered as ${user.role === 'user' ? 'Quote User' : 'Quote Creator'}. Please select the correct role.`);
        return;
      }
      localStorage.setItem('whisper_current_user', JSON.stringify({ email: user.email, name: user.name, role: user.role }));
      showToast(`Welcome ${user.name}! Redirecting...`);
      setTimeout(() => {
        if (selectedRole === 'user') window.location.href = 'quoteuser.html';
        else window.location.href = 'quotecreator.html';
      }, 1500);
    });

    document.getElementById('registerBtn').addEventListener('click', () => {
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPass').value;
      const confirm = document.getElementById('regConfirm').value;
      if (!name || !email || !password) { showToast('Please fill all fields'); return; }
      if (password !== confirm) { showToast('Passwords do not match'); return; }
      if (password.length < 4) { showToast('Password must be at least 4 characters'); return; }
      if (!email.includes('@') || !email.includes('.')) { showToast('Enter a valid email address'); return; }
      let users = JSON.parse(localStorage.getItem('whisper_users') || '[]');
      if (users.find(u => u.email === email)) { showToast('Email already registered. Please login.'); return; }
      users.push({ name, email, password, role: selectedRole });
      localStorage.setItem('whisper_users', JSON.stringify(users));
      showToast('🎉 Registration successful! Please login.');
      loginForm.classList.remove('hidden-form');
      registerForm.classList.add('hidden-form');
      document.getElementById('loginEmail').value = email;
      document.getElementById('loginPass').value = '';
      document.getElementById('regName').value = '';
      document.getElementById('regEmail').value = '';
      document.getElementById('regPass').value = '';
      document.getElementById('regConfirm').value = '';
      updateHeartMeter();
    });
  </script>
</body>
</html>
