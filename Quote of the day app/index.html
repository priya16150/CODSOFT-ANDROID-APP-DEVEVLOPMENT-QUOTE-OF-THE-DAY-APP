<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Daily Whisper · Welcome</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #0f0717 0%, #1a0f2e 50%, #0f0717 100%);
    }
    .floating-bg {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none;
    }
    .orb-bg {
      position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(155,107,204,0.2), transparent);
      filter: blur(60px); animation: floatOrb 20s infinite alternate;
    }
    .orb1 { width: 400px; height: 400px; top: -150px; left: -150px; }
    .orb2 { width: 500px; height: 500px; bottom: -200px; right: -200px; animation-duration: 30s; }
    .orb3 { width: 300px; height: 300px; top: 50%; left: 20%; animation-duration: 18s; }
    @keyframes floatOrb { 100% { transform: translate(60px,60px) scale(1.2); opacity: 0.6; } }
    .float-item {
      position: absolute; font-size: 1.2rem; opacity: 0;
      animation: floatPositive 12s linear infinite; pointer-events: none;
    }
    .float-item:nth-child(1) { top: 10%; left: 5%; animation-duration: 14s; font-size: 1.8rem; }
    .float-item:nth-child(2) { top: 20%; left: 85%; animation-duration: 18s; font-size: 2rem; }
    .float-item:nth-child(3) { top: 70%; left: 15%; animation-duration: 16s; font-size: 1.5rem; }
    .float-item:nth-child(4) { top: 80%; left: 75%; animation-duration: 20s; font-size: 2.2rem; }
    .float-item:nth-child(5) { top: 40%; left: 45%; animation-duration: 15s; font-size: 1.6rem; }
    .float-item:nth-child(6) { top: 60%; left: 92%; animation-duration: 22s; font-size: 1.4rem; }
    @keyframes floatPositive {
      0% { transform: translateY(100vh) rotate(0deg) scale(0.5); opacity: 0; }
      10% { opacity: 0.8; }
      90% { opacity: 0.8; }
      100% { transform: translateY(-100vh) rotate(360deg) scale(1.2); opacity: 0; }
    }
    .stars {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none;
    }
    .star {
      position: absolute; background: white; border-radius: 50%; width: 2px; height: 2px;
      opacity: 0.6; animation: twinkle 3s infinite alternate;
    }
    @keyframes twinkle { 100% { opacity: 1; transform: scale(1.2); } }
    .welcome-container {
      max-width: 650px; width: 100%; margin: auto; position: relative; z-index: 10;
    }
    .welcome-card {
      background: rgba(255,255,255,0.92); backdrop-filter: blur(12px); border-radius: 40px;
      padding: 1.6rem 1.5rem; text-align: center; border: 1px solid rgba(255,255,240,0.6);
      animation: fadeInUp 0.8s cubic-bezier(0.2,0.9,0.4,1.1), borderGlow 3s ease-in-out infinite;
    }
    @keyframes borderGlow {
      50% { border-color: rgba(155,107,204,0.6); box-shadow: 0 20px 45px -5px rgba(155,107,204,0.3); }
    }
    @keyframes fadeInUp { from { opacity:0; transform:translateY(30px); } to { opacity:1; transform:translateY(0); } }
    .icon-large {
      font-size: 2.5rem; color: #9b6bcc; margin-bottom: 0.5rem;
      animation: floatIcon 3s ease-in-out infinite, glowIcon 2s ease-in-out infinite;
      display: inline-block;
    }
    @keyframes floatIcon { 50% { transform: translateY(-6px) rotate(5deg); } }
    @keyframes glowIcon { 50% { text-shadow: 0 0 12px rgba(155,107,204,0.6); } }
    h1 {
      font-size: 2rem; background: linear-gradient(135deg, #5f3b8c, #9b6bcc);
      background-clip: text; -webkit-background-clip: text; color: transparent;
      margin-bottom: 0.25rem;
    }
    .tagline { color: #4a3a62; font-size: 0.9rem; margin-bottom: 1.2rem; }
    .btn-getstarted {
      background: #7c4dff; color: white; border: none; padding: 10px 24px;
      border-radius: 50px; font-weight: 600; font-size: 1rem; cursor: pointer;
      display: inline-flex; align-items: center; gap: 8px; margin-bottom: 1.2rem;
      animation: pulseBtn 2s infinite; box-shadow: 0 6px 18px rgba(124,77,255,0.3);
      position: relative; overflow: hidden;
    }
    .btn-getstarted::before {
      content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      transition: left 0.5s;
    }
    .btn-getstarted:hover::before { left: 100%; }
    @keyframes pulseBtn { 50% { transform: scale(1.05); box-shadow: 0 10px 25px rgba(124,77,255,0.5); } }
    .how-it-works {
      background: rgba(255,255,255,0.7); backdrop-filter: blur(4px); border-radius: 28px;
      padding: 1rem; text-align: left;
    }
    .how-it-works h3 {
      font-size: 1.2rem; margin-bottom: 0.8rem; color: #5f3b8c;
      display: flex; align-items: center; gap: 8px; justify-content: center;
    }
    .steps { display: flex; flex-wrap: wrap; gap: 0.8rem; justify-content: center; }
    .step {
      flex: 1; min-width: 110px; background: white; border-radius: 20px; padding: 0.7rem;
      text-align: center; transition: all 0.3s ease;
      animation: stepPop 0.5s cubic-bezier(0.34,1.2,0.64,1) backwards;
    }
    .step:nth-child(1) { animation-delay: 0.5s; }
    .step:nth-child(2) { animation-delay: 0.6s; }
    .step:nth-child(3) { animation-delay: 0.7s; }
    @keyframes stepPop { from { opacity:0; transform:scale(0.8) rotate(-3deg); } to { opacity:1; transform:scale(1) rotate(0); } }
    .step:hover { transform: translateY(-6px) scale(1.02); background: #faf5ff; }
    .step i { font-size: 1.5rem; color: #9b6bcc; margin-bottom: 0.3rem; }
    .step p { font-size: 0.75rem; color: #4a3a62; }
    .footer-note { margin-top: 0.8rem; font-size: 0.7rem; color: #a28fc2; text-align: center; }
    @media (max-width: 550px) {
      .welcome-card { padding: 1.2rem; }
      h1 { font-size: 1.7rem; }
      .btn-getstarted { padding: 8px 20px; font-size: 0.9rem; }
    }
  </style>
</head>
<body>
  <div class="floating-bg">
    <div class="orb-bg orb1"></div><div class="orb-bg orb2"></div><div class="orb-bg orb3"></div>
    <div class="float-item">✨</div><div class="float-item">❤️</div><div class="float-item">🌟</div>
    <div class="float-item">🕊️</div><div class="float-item">⭐</div><div class="float-item">💖</div>
    <div class="float-item">🌸</div><div class="float-item">🌞</div><div class="float-item">🍃</div>
    <div class="float-item">💫</div><div class="float-item">🌙</div><div class="float-item">✨</div>
  </div>
  <div class="stars" id="stars"></div>
  <div class="welcome-container">
    <div class="welcome-card">
      <i class="fas fa-feather-alt icon-large"></i>
      <h1>Daily Whisper</h1>
      <p class="tagline">One inspiring thought every sunrise</p>
      <button class="btn-getstarted" id="getStartedBtn">Get Started → <i class="fas fa-arrow-right"></i></button>
      <div class="how-it-works">
        <h3><i class="fas fa-lightbulb"></i> How it works</h3>
        <div class="steps">
          <div class="step"><i class="fas fa-user-plus"></i><p><strong>1. Register</strong><br>Just your name, no password</p></div>
          <div class="step"><i class="fas fa-calendar-day"></i><p><strong>2. Daily Quote</strong><br>Fresh inspiration each day</p></div>
          <div class="step"><i class="fas fa-heart"></i><p><strong>3. Save & Share</strong><br>Favorite quotes & share with friends</p></div>
        </div>
        <p class="footer-note">✨ Quotes refresh daily or on demand</p>
      </div>
    </div>
  </div>
  <script>
    const starsDiv = document.getElementById('stars');
    for (let i=0; i<150; i++) {
      const s = document.createElement('div'); s.classList.add('star');
      s.style.left = Math.random()*100+'%'; s.style.top = Math.random()*100+'%';
      s.style.animationDelay = Math.random()*5+'s'; s.style.width = Math.random()*3+1+'px';
      s.style.height = s.style.width; starsDiv.appendChild(s);
    }
    document.getElementById('getStartedBtn').addEventListener('click', () => {
      window.location.href = 'login.html';
    });
  </script>
</body>
</html>
